x-logging-config:
  &logging-config
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

services:
  factorio:
    image: factoriotools/factorio:2.1.24-rootless
    container_name: app-factorio
    restart: unless-stopped
    volumes:
      - '/mnt/Fast/Configuration/factorio/:/factorio'
    logging: *logging-config