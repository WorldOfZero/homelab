
x-logging-config:
  &logging-config
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

services:
  roonserver:
    image: steefdebruijn/docker-roonserver:debian-12-slim
    restart: unless-stopped
    # Macvlan instead of network_mode: host (#diagnose-roon-disconnects): Roon's bundled
    # .NET runtime crashes with "An invalid IP address was specified" (dotnet/runtime#49515)
    # when it enumerates host interfaces while Docker veths come and go. On its own macvlan
    # interface the container sees only eth0 + lo, and RAAT/discovery still work because
    # macvlan sits directly on the LAN at L2.
    networks:
      roon-lan:
        ipv4_address: 192.168.1.212 # Outside the UniFi DHCP range; see README
        mac_address: "02:52:4f:4f:4e:01" # Fixed, so UniFi tracks one client across container recreates; 02 = locally administered
    # The macvlan network is IPv4-only. With IPv6 on, Roon connects to IPv6 addresses
    # (Qobuz streams) and fails with "Network is unreachable" instead of using IPv4.
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
      net.ipv6.conf.default.disable_ipv6: 1
    environment:
      TZ: "America/Los_Angeles"
    volumes:
      - /mnt/Fast/Configuration/roon/app:/app
      - /mnt/Fast/Configuration/roon/data:/data
      - /mnt/Vault/Media/Music:/music
      - /mnt/Fast/Configuration/roon/backup:/backup
    logging: *logging-config

networks:
  roon-lan:
    driver: macvlan
    driver_opts:
      # The physical LAN NIC on minerva. Find it with: ip route get 192.168.1.1
      parent: eno1
    ipam:
      driver: default
      config:
        - subnet: 192.168.1.0/24
          gateway: 192.168.1.1
