x-logging-config:
  &logging-config
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

# Each listener has its own Serve port, on the tailnet only. Guests use movie-night.worldofzero.com, through the
# cloudflared container. Never make 8443 or 8081 public: host sign-in and room creation are there.
configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true},"8443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8080"}}},
      "$${TS_CERT_DOMAIN}:8443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8081"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false,"$${TS_CERT_DOMAIN}:8443":false}}

# Movie Night (github.com/WorldOfZero/movie-night) - people vote on movies from Jellyfin on their
# phones, and a TV page shows the result.
services:
  # Tailscale Sidecar Configuration
  tailscale:
    image: tailscale/tailscale:v1.98 # Image to be used
    container_name: tailscale-movie-night # Name for local container management
    hostname: movie-night # Name used within your Tailscale environment
    networks:
      - default
      - tailnet-local # Shared with the other sidecars on this host. The application also reaches Jellyfin and Prometheus reaches the application through it
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json # Tailscale Serve configuration, on the tailnet only
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_ENABLE_METRICS=true
      - TS_LOCAL_ADDR_PORT=0.0.0.0:41234       # The <addr>:<port> for the healthz and metrics endpoints
      - TS_ACCEPT_DNS=true
      - TS_AUTH_ONCE=true
      - TS_EXTRA_ARGS=--advertise-tags=tag:movie-night # Applies only at the first login. For a registered node, set the tag in the admin console
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - /mnt/Fast/Configuration/tailscale/state-movie-night:/var/lib/tailscale # Tailscale requirement
    devices:
      - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
    cap_add:
      - net_admin # Tailscale requirement
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: always
    logging: *logging-config

  db:
    container_name: movie-night_db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/Fast/Configuration/movie-night/postgresql/data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *logging-config

  # Daily pg_dump snapshots with 7 daily / 4 weekly / 6 monthly retention (the image's own defaults).
  backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: movie-night_db_backup
    restart: unless-stopped
    environment:
      - POSTGRES_HOST=db
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - /mnt/Fast/Configuration/movie-night/postgresql/backups:/backups
    depends_on:
      db:
        condition: service_healthy
    logging: *logging-config

  application:
    image: ghcr.io/worldofzero/movie-night:${MOVIE_NIGHT_VERSION:?Set MOVIE_NIGHT_VERSION in the Portainer stack variables}
    network_mode: service:tailscale # Sidecar configuration to route the application through Tailscale
    container_name: app-movie-night # Name for local container management
    environment:
      - TZ=America/Los_Angeles
      - DATABASE_URL=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      - JELLYFIN_URL=http://tailscale-jellyfin:8096
      - JELLYFIN_API_KEY=${MOVIE_NIGHT_JELLYFIN_APIKEY:?Set MOVIE_NIGHT_JELLYFIN_APIKEY in the Portainer stack variables}
      - JELLYFIN_LIBRARIES=${MOVIE_NIGHT_JELLYFIN_LIBRARIES:?Set MOVIE_NIGHT_JELLYFIN_LIBRARIES in the Portainer stack variables}
      - JELLYFIN_WEB_URL=https://jellyfin.comet-stork.ts.net
      - PUBLIC_URL=https://movie-night.worldofzero.com
      - TRUSTED_PROXIES=127.0.0.1 # cloudflared and Tailscale Serve connect from localhost and set X-Forwarded-For
      # - PLAY_LAUNCHERS= # Optional. See ENVIRONMENT.md in the movie-night repo
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    depends_on:
      tailscale:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/movie-night", "healthcheck"] # The image has no shell or curl
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks
    restart: always
    logging: *logging-config

  # Cloudflare Tunnel: publishes the guest port as movie-night.worldofzero.com. Never route port 8081 through the tunnel on worldofzero.com without an open router port.
  # The public hostname and its service (http://127.0.0.1:8080) are set on the tunnel in the
  # Cloudflare dashboard, not here.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.7
    container_name: cloudflared-movie-night
    network_mode: service:tailscale # Shares localhost with the application, so the tunnel reaches it on 127.0.0.1
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      - TUNNEL_TOKEN=${MOVIE_NIGHT_TUNNEL_TOKEN:?Set MOVIE_NIGHT_TUNNEL_TOKEN in the Portainer stack variables}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 100
    depends_on:
      application:
        condition: service_healthy
    restart: always
    logging: *logging-config

networks:
  tailnet-local:
    external: true # Create once on the host: docker network create tailnet-local
