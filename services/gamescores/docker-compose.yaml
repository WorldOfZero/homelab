x-logging-config:
  &logging-config
  driver: "json-file"
  options:
    max-size: "1m"
    max-file: "1"
    tag: "{{.Name}}"

configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8080"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

# GameScores (github.com/WorldOfZero/GameScores) - Blazor Server board game
# scoresheets with live sync between devices over SignalR.
#
# Rooms are in memory only. An image update or restart drops every active
# room; browsers restore their room from a local snapshot when they reconnect,
# so this is expected and not a bug.
services:
  tailscale:
    image: tailscale/tailscale:v1.98 # Image to be used
    container_name: tailscale-gamescores # Name for local container management
    hostname: gamescores # Name used within your Tailscale environment
    networks:
      - default
      - tailnet-local # Shared with the other sidecars on this host so tailscaled finds a direct path instead of relaying via DERP
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json # Tailscale Serve configuration to expose the web interface on your local Tailnet - remove this line if not required
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true # Enable healthcheck endpoint: "/healthz"
      - TS_LOCAL_ADDR_PORT=127.0.0.1:41234 # The <addr>:<port> for the healthz endpoint
      - TS_ACCEPT_DNS=true # Uncomment when using MagicDNS
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - '/mnt/Fast/Configuration/tailscale/state-gamescores:/var/lib/tailscale'
    devices:
      - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
    cap_add:
      - net_admin # Tailscale requirement
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    restart: always

  application:
    container_name: gamescores
    image: ghcr.io/worldofzero/gamescores:0.0.90
    network_mode: service:tailscale # Sidecar configuration to route GameScores through Tailscale
    environment:
      - TZ=America/Los_Angeles
    # No state to mount - rooms live in memory only (see the note above).
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      # The aspnet runtime image has no curl/wget/nc, so make the HTTP request by
      # hand with bash's built-in /dev/tcp. (CMD-SHELL would run /bin/sh, which
      # is dash on Debian and has no /dev/tcp - hence calling bash explicitly.)
      test:
        - CMD
        - bash
        - -c
        - |
          set -e
          # Open a connection to GameScores on fd 3 (fails if nothing is listening)
          exec 3<>/dev/tcp/127.0.0.1/8080
          # Ask for the health endpoint
          printf 'GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3
          # Healthy only if the response status line is "HTTP/1.x 200 ..."
          head -n 1 <&3 | grep -q '^HTTP/1\.[01] 200 '
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 30s # Time to wait before starting health checks
    restart: always
    logging: *logging-config

networks:
  tailnet-local:
    external: true # Create once on the host: docker network create tailnet-local
