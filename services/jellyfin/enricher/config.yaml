# jellyfin-enricher rules. Each rule: if an item's IMDb keywords include any of `imdb_keywords`
# (case-insensitive, "-" == " "), append `add.tags` / `add.genres` to the item. Additive only:
# nothing is ever removed, so deleting a rule leaves previously added tags in place.
#
# Tag names are the ones the Auto Collections plugin's TAG expressions match on, so the
# collections fill in without touching the plugin. The second block ports Kometa's imdb_keyword
# collections from services/plex/kometa/Movies.yml.

item_types: [Movie, Series]

# Auto Collections plugin definitions, synced into the plugin on every run. The file is the
# plugin's own export/import JSON, so it can also be imported by hand in the plugin's UI, or
# re-exported from the UI and committed. Remove this block to stop managing the plugin from here.
auto_collections:
  file: auto-collections.json   # relative to this file
  plugin_name: Auto Collections # as listed in Dashboard -> Plugins
  task_name: Auto Collection    # substring of the plugin's scheduled task; started after changes
  # Optional primary image per collection: a file named after the collection, e.g.
  # "Aviation Collection.jpg" (.jpg, .png or .webp). Set after the plugin's task has finished.
  images: collection-images     # relative to this file
  task_wait_minutes: 30         # how long to wait for the task before setting images anyway

# Tags kept in step with what users do, for the Started Movies and Rewatch Favorites collections.
# Unlike the rule tags below, the enricher also removes these when they stop applying. They are
# updated on each run, so they can be up to a day behind.
user_state_tags:
  item_types: [Movie]
  tags:
    in_progress: in progress   # any user has started it but not finished it
    favourite: favourite       # any user has marked it as a favourite

# Tags kept in step with each show's status in Jellyfin (from TMDb), for the Ended Shows and
# Running Shows collections. Like the playback tags, these are removed when the status changes.
series_status_tags:
  Ended: ended
  Continuing: continuing

imdb_keywords:
  sources: [kometa, imdb]   # tried in order per title; results cached on disk
  cache_days: 30
  request_delay_seconds: 1.0

max_lookups_per_run: 2000   # bounds the first run on a big library; the rest are picked up next run

defaults:
  # IMDb shows "N of M found this relevant" per keyword. Most keywords have no votes at all
  # ([0, 0]), including many accurate ones and every keyword on most older films, so a keyword
  # with no votes is accepted. min_percentage only applies once someone has voted: 0.5 rejects
  # keywords voted down (e.g. "christmas" at 0 of 1 on Nosferatu). Raise min_relevant per rule
  # for keywords that IMDb applies loosely.
  min_relevant: 0
  min_votes: 0
  min_percentage: 0.5

rules:
  # --- Tags used by the existing Auto Collections expressions ---
  - match: {imdb_keywords: [heist, bank heist, bank robbery, heist movie]}
    add: {tags: [heist]}
  # min_relevant: 1 on loosely applied keywords: unvoted, they are often wrong (spy and assassin
  # on Lost in Space, independent film on Red Sonja, folk horror on Saint Maud).
  - match: {imdb_keywords: [spy, espionage, secret agent, spy thriller], min_relevant: 1}
    add: {tags: [spy]}
  - match: {imdb_keywords: [vampire]}
    add: {tags: [vampire]}
  - match: {imdb_keywords: [zombie, zombie apocalypse]}
    add: {tags: [zombie]}
  - match: {imdb_keywords: [werewolf]}
    add: {tags: [werewolf]}
  - match: {imdb_keywords: [monster, giant monster, kaiju, creature feature]}
    add: {tags: [monster]}
  - match: {imdb_keywords: [demon, demonic possession]}
    add: {tags: [demon]}
  - match: {imdb_keywords: [body horror]}
    add: {tags: [body horror]}
  - match: {imdb_keywords: [magic, sorcery, wizard]}
    add: {tags: [magic]}
  - match: {imdb_keywords: [whodunit, murder mystery]}
    add: {tags: [whodunit]}
  - match: {imdb_keywords: [mafia, mobster, organized crime]}
    add: {tags: [mafia]}
  - match: {imdb_keywords: [con man, con artist, swindle, swindler, grifter]}
    add: {tags: [conman]}
  - match: {imdb_keywords: [romantic comedy, romcom]}
    add: {tags: [romcom]}
  - match: {imdb_keywords: [lego]}
    add: {tags: [lego]}
  - match: {imdb_keywords: [hacker, hacking, computer hacker]}
    add: {tags: [hacker]}
  - match: {imdb_keywords: [james bond, "007"]}  # quoted: bare 007 is a YAML int
    add: {tags: [james bond]}
  - match: {imdb_keywords: [based on video game]}
    add: {tags: [based on video game]}
  - match: {imdb_keywords: [based on novel, based on book]}
    add: {tags: [based on book]}
  - match: {imdb_keywords: [based on comic, based on comic book, based on graphic novel]}
    add: {tags: [based on comic]}
  # The lesbian, gay, trans and queer rules also add lgbt, so the lgbt tag covers all of them.
  # min_percentage 0.6: an even split means a passing scene, not the film's subject (lesbian at 3
  # of 6 on Species).
  - match: {imdb_keywords: [lgbt, lgbtq, lgbtq+, lgbt plus, lgbtq film, bisexual, bisexuality], min_percentage: 0.6}
    add: {tags: [lgbt]}
  - match: {imdb_keywords: [lesbian, lesbian relationship], min_percentage: 0.6}
    add: {tags: [lesbian, lgbt]}
  - match: {imdb_keywords: [gay, gay relationship], min_percentage: 0.6}
    add: {tags: [gay, lgbt]}
  - match: {imdb_keywords: [transgender, trans woman, trans man], min_percentage: 0.6}
    add: {tags: [trans, lgbt]}
  - match: {imdb_keywords: [queer, queer cinema], min_percentage: 0.6}
    add: {tags: [queer, lgbt]}
  # Not menage a trois or open marriage: IMDb uses them for one-off threesomes and affairs.
  - match: {imdb_keywords: [polyamory, polyamorous, polyamorous relationship, throuple, three way relationship]}
    add: {tags: [polyamory]}
  - match: {imdb_keywords: [bdsm, sadomasochism, kink]}
    add: {tags: [bdsm]}
  - match: {imdb_keywords: [leather]}
    add: {tags: [leather]}
  - match: {imdb_keywords: [latex, latex fetish, rubber fetish]}
    add: {tags: [latex]}
  - match: {imdb_keywords: [independent film], min_relevant: 1}
    add: {tags: [independent film]}
  - match: {imdb_keywords: [anime]}
    add: {tags: [anime]}
  - match: {imdb_keywords: [anthology, anthology film, horror anthology]}
    add: {tags: [anthology]}

  # --- Ported Kometa imdb_keyword collections (need a matching Auto Collections TAG rule) ---
  - match: {imdb_keywords: [sword and sorcery]}
    add: {tags: [sword and sorcery]}
  - match: {imdb_keywords: [b movie]}
    add: {tags: [b movie]}
  - match: {imdb_keywords: [alien]}
    add: {tags: [alien]}
  - match: {imdb_keywords: [mythology, myth]}
    add: {tags: [mythology]}
  - match: {imdb_keywords: [grindhouse], min_relevant: 1}
    add: {tags: [grindhouse]}
  - match: {imdb_keywords: [satire]}
    add: {tags: [satire]}
  - match: {imdb_keywords: [medical, medical drama]}  # not doctor/nurse: any film with one in it
    add: {tags: [medical]}
  - match: {imdb_keywords: [steampunk]}
    add: {tags: [steampunk]}
  - match: {imdb_keywords: [mecha, mech]}
    add: {tags: [mecha]}
  - match: {imdb_keywords: [caper]}
    add: {tags: [caper]}
  - match: {imdb_keywords: [corruption]}
    add: {tags: [corruption]}
  - match: {imdb_keywords: [cyberpunk]}
    add: {tags: [cyberpunk]}
  - match: {imdb_keywords: [post apocalypse, post apocalyptic, post apocalyptic future]}
    add: {tags: [post apocalypse]}
  - match: {imdb_keywords: [wilhelm scream]}
    add: {tags: [wilhelm scream]}
  - match: {imdb_keywords: [assassin, hitman, contract killer], min_relevant: 1}
    add: {tags: [assassin]}

  # --- Remaining Kometa topics (anime ones were anilist_search; IMDb keywords approximate them) ---
  - match: {imdb_keywords: [lovecraftian, cosmic horror, cthulhu mythos, h.p. lovecraft]}
    add: {tags: [lovecraftian]}
  - match: {imdb_keywords: [martial arts, kung fu, wuxia]}
    add: {tags: [martial arts]}
  - match: {imdb_keywords: [splatter, gore, extreme gore]}
    add: {tags: [splatter]}
  - match: {imdb_keywords: [mindfuck, mind bender, mind bending, reality bending]}
    add: {tags: [mind bending]}
  - match: {imdb_keywords: [chick flick]}
    add: {tags: [chick flick]}
  - match: {imdb_keywords: [isekai, transported to another world]}
    add: {tags: [isekai]}
  - match: {imdb_keywords: [slice of life]}
    add: {tags: [slice of life]}
  - match: {imdb_keywords: [iyashikei]}
    add: {tags: [iyashikei]}
  - match: {imdb_keywords: [yuri, girls love]}
    add: {tags: [yuri]}
  - match: {imdb_keywords: [shonen, shounen]}
    add: {tags: [shounen]}
  - match: {imdb_keywords: [shojo, shoujo]}
    add: {tags: [shoujo]}
  - match: {imdb_keywords: [seinen]}
    add: {tags: [seinen]}
  - match: {imdb_keywords: [josei]}
    add: {tags: [josei]}

  # --- Sci-fi & fantasy ---
  - match: {imdb_keywords: [time travel, time machine]}
    add: {tags: [time travel]}
  - match: {imdb_keywords: [time loop]}
    add: {tags: [time loop]}
  - match: {imdb_keywords: [dystopia, totalitarianism]}
    add: {tags: [dystopia]}
  - match: {imdb_keywords: [space opera, outer space, spaceship]}
    add: {tags: [space]}
  - match: {imdb_keywords: [artificial intelligence, android, sentient computer]}  # not robot
    add: {tags: [artificial intelligence]}
  - match: {imdb_keywords: [superhero, superheroine, super powers]}
    add: {tags: [superhero]}
  - match: {imdb_keywords: [alternate history]}
    add: {tags: [alternate history]}
  - match: {imdb_keywords: [parallel universe, multiverse]}  # alternate reality is often alternate history
    add: {tags: [multiverse]}
  - match: {imdb_keywords: [virtual reality, simulated reality]}
    add: {tags: [virtual reality]}
  - match: {imdb_keywords: [dinosaur, dinosaurs, dinosaur feature, dinosaur attack, tyrannosaurus rex,
                            velociraptor, triceratops, stegosaurus, brontosaurus, pterodactyl]}
    add: {tags: [dinosaur]}
  - match: {imdb_keywords: [kaiju, giant monster]}
    add: {tags: [kaiju]}
  - match: {imdb_keywords: [dragon]}
    add: {tags: [dragon]}
  - match: {imdb_keywords: [fairy tale, based on fairy tale]}
    add: {tags: [fairy tale]}

  # --- Horror ---
  - match: {imdb_keywords: [ghost, haunted house, haunting, poltergeist]}
    add: {tags: [ghost]}
  - match: {imdb_keywords: [witch, witchcraft, coven]}
    add: {tags: [witch]}
  - match: {imdb_keywords: [slasher, slasher flick, masked killer]}
    add: {tags: [slasher]}
  - match: {imdb_keywords: [found footage]}
    add: {tags: [found footage]}
  - match: {imdb_keywords: [folk horror, pagan], min_relevant: 1}
    add: {tags: [folk horror]}
  - match: {imdb_keywords: [shark, killer shark, killer animal]}  # not animal attack (Song of the South)
    add: {tags: [killer animal]}
  - match: {imdb_keywords: [cult, cult leader, religious cult]}
    add: {tags: [cult]}
  # Not octopus or squid: IMDb adds them for a seafood dinner or an aquarium scene.
  - match: {imdb_keywords: [tentacle, tentacles, tentacled creature, tentacled monster, tentacle monster,
                            giant octopus, giant squid, kraken]}
    add: {tags: [tentacles]}

  # --- Crime, thriller & drama ---
  - match: {imdb_keywords: [serial killer]}
    add: {tags: [serial killer]}
  - match: {imdb_keywords: [revenge, vengeance]}
    add: {tags: [revenge]}
  - match: {imdb_keywords: [prison, prison escape]}  # not prisoner: hostages, POWs
    add: {tags: [prison]}
  - match: {imdb_keywords: [courtroom, trial, courtroom drama]}  # not lawyer
    add: {tags: [courtroom]}
  - match: {imdb_keywords: [conspiracy, cover up]}
    add: {tags: [conspiracy]}
  - match: {imdb_keywords: [survival, stranded, wilderness survival], min_relevant: 1}
    add: {tags: [survival]}
  - match: {imdb_keywords: [disaster, natural disaster, disaster film]}
    add: {tags: [disaster]}
  - match: {imdb_keywords: [based on true story, based on real events]}
    add: {tags: [based on true story]}

  # --- Settings & occasions ---
  - match: {imdb_keywords: [world war two, world war ii, second world war]}
    add: {tags: [world war ii]}
  - match: {imdb_keywords: [cold war]}
    add: {tags: [cold war]}
  # Aviation: planes as a main topic. min_relevant: 1 because a plane scene is enough for IMDb to add
  # these unvoted ("pilot" on Lost in Space). Broad words like airplane need two votes. Not airplane
  # crash: Cast Away and Alive are about surviving one, not about flying; Sully and Flight match on pilot.
  - match:
      imdb_keywords: [pilot, airline pilot, airplane pilot, aircraft pilot, fighter pilot, military pilot,
                      test pilot, aviator, naval aviator, aviation, military aviation, naval aviation,
                      flight school, flight attendant, stewardess, air traffic control,
                      air traffic controller, aerial combat, dogfight, airplane hijacking]
      min_relevant: 1
    add: {tags: [aviation]}
  - match: {imdb_keywords: [airplane, aircraft, flying], min_relevant: 2}
    add: {tags: [aviation]}
  - match: {imdb_keywords: [pirate, pirate ship]}
    add: {tags: [pirate]}
  - match: {imdb_keywords: [samurai, ronin]}
    add: {tags: [samurai]}
  - match: {imdb_keywords: [ninja]}
    add: {tags: [ninja]}
  - match: {imdb_keywords: [christmas, christmas eve, santa claus]}
    add: {tags: [christmas]}
  - match: {imdb_keywords: [halloween]}
    add: {tags: [halloween]}
  - match: {imdb_keywords: [road trip, road movie]}
    add: {tags: [road trip]}
  - match: {imdb_keywords: [coming of age]}
    add: {tags: [coming of age]}
  - match: {imdb_keywords: [high school, high school student]}
    add: {tags: [high school]}
  - match: {imdb_keywords: [sport, sports, boxing, boxer, football, baseball, basketball]}
    add: {tags: [sports]}

  # --- Themes and forms, checked against IMDb data for example films on 2026-10-27 ---
  # The bare "car chase", "racing" and "neo noir" keywords are often added for a single scene (car
  # chase on National Treasure, racing on The Social Network), so they need a relevance vote.
  - match: {imdb_keywords: [car chase, highway chase, car chase scene], min_relevant: 1}
    add: {tags: [car chase]}
  - match: {imdb_keywords: [treasure hunt, treasure hunter, treasure map, hidden treasure, lost treasure,
                            buried treasure], min_relevant: 1}
    add: {tags: [treasure hunt]}
  - match: {imdb_keywords: [vigilante, vigilantism, vigilante justice, masked vigilante], min_relevant: 1}
    add: {tags: [vigilante]}
  - match: {imdb_keywords: [kung fu, wuxia, kung fu master, hong kong kung fu, kung fu action], min_relevant: 1}
    add: {tags: [kung fu]}
  - match: {imdb_keywords: [erotic thriller], min_relevant: 1}
    add: {tags: [erotic thriller]}
  - match: {imdb_keywords: [psychological thriller]}
    add: {tags: [psychological thriller]}
  - match: {imdb_keywords: [creature feature, monster movie]}
    add: {tags: [creature feature]}
  - match: {imdb_keywords: [car racing, auto racing, automobile racing, motor racing, stock car racing,
                            race car driver, formula one, nascar, motorcycle racing, drag racing]}
    add: {tags: [racing]}
  - match: {imdb_keywords: [racing], min_relevant: 1}
    add: {tags: [racing]}
  - match: {imdb_keywords: [concert film, live in concert recording, concert documentary]}
    add: {tags: [concert film]}
  # Not "musical number" or "singing": IMDb uses them for one song in any film (Whiplash, Bohemian Rhapsody).
  - match: {imdb_keywords: [musical, classic musical, movie musical, based on stage musical, based on broadway musical,
                            rock musical, jukebox musical, pop musical, mgm musical, 20th century fox musical,
                            universal musical, warner bros musical, paramount musical, british musical]}
    add: {tags: [musical]}
  - match: {imdb_keywords: [film noir, classic film noir]}
    add: {tags: [film noir]}
  - match: {imdb_keywords: [neo noir], min_relevant: 2, min_percentage: 0.75}
    add: {tags: [film noir]}
  - match: {imdb_keywords: [biopic, biography, biographical, based on biography, based on autobiography,
                            political biopic, music biopic, sports biopic, ends with biographical notes]}
    add: {tags: [biopic]}
  - match: {imdb_keywords: [based on real person], min_relevant: 1}
    add: {tags: [biopic]}
  # Checked 2026-10-27: hypnosis on Get Out, Caligari, Now You See Me, Dr. Mabuse, The Manchurian
  # Candidate; mind control on They Live, Kingsman, Being John Malkovich, X2. "Hypnotized man/woman"
  # and "subliminal message" also turn up for a single scene (X2), so they need a vote.
  - match: {imdb_keywords: [hypnosis, hypnotism, hypnotist, hypnotic trance, hypnotic suggestion,
                            post hypnotic suggestion, mesmerism]}
    add: {tags: [hypnosis]}
  - match: {imdb_keywords: [hypnotized woman, hypnotized man], min_relevant: 1}
    add: {tags: [hypnosis]}
  - match: {imdb_keywords: [mind control, brainwashing, mind controlled human, mind controlled killer,
                            brainwashed assassin, sleeper agent]}
    add: {tags: [mind control]}
  - match: {imdb_keywords: [subliminal message], min_relevant: 1}
    add: {tags: [mind control]}
  # Holidays, checked 2026-10-27: IMDb adds them for a single scene too (New Year's Eve on When
  # Harry Met Sally, the Fourth of July on Jaws is borderline), so they need a vote.
  - match: {imdb_keywords: [valentine's day], min_relevant: 1}
    add: {tags: [valentine's day]}
  - match: {imdb_keywords: [thanksgiving, thanksgiving dinner, thanksgiving day, thanksgiving comedy,
                            thanksgiving horror, thanksgiving parade], min_relevant: 1}
    add: {tags: [thanksgiving]}
  - match: {imdb_keywords: [new year's eve, new year's eve party, new year's day], min_relevant: 1}
    add: {tags: [new year's]}
  - match: {imdb_keywords: [fourth of july, independence day, july 4th, 4th of july], min_relevant: 1}
    add: {tags: [independence day]}
  # Weddings, checked 2026-10-27. Not "wedding" itself: The Godfather has it at 8 of 8 for its
  # opening. These only appear when the wedding is the story; Shrek's and The Graduate's endings miss.
  - match: {imdb_keywords: [bridesmaid, maid of honor, wedding planning, wedding planner, planning a wedding,
                            father of the bride, wedding crasher, bride as protagonist, wedding gone wrong,
                            bride to be, wedding rehearsal dinner, wedding coordinator, wedding singer,
                            wedding preparations]}
    add: {tags: [wedding]}
  - match: {imdb_keywords: [objection at a wedding], min_relevant: 1}  # not canceled wedding: Shrek has it
    add: {tags: [wedding]}
  # Checked 2026-10-27 on Poltergeist, The Descent, Signs, Harold & Kumar, Home Alone and others.
  - match: {imdb_keywords: [haunted house, haunted mansion]}
    add: {tags: [haunted house]}
  - match: {imdb_keywords: [survival horror]}
    add: {tags: [survival horror]}
  - match: {imdb_keywords: [alien invasion, invasion of earth]}
    add: {tags: [alien invasion]}
  - match: {imdb_keywords: [alien invasion sci fi], min_relevant: 1}  # unvoted on Alien
    add: {tags: [alien invasion]}
  - match: {imdb_keywords: [feel good, feel good movie, feel good comedy, feel good romance, heartwarming, uplifting]}
    add: {tags: [feel good]}
  - match: {imdb_keywords: [tearjerker, tear jerker, tearjerker romance]}
    add: {tags: [tearjerker]}
  - match: {imdb_keywords: [stoner comedy, stoner film]}
    add: {tags: [stoner comedy]}
  - match: {imdb_keywords: [stoner], min_relevant: 2}  # Attack the Block has it at 1 of 1
    add: {tags: [stoner comedy]}
  - match: {imdb_keywords: [slapstick, slapstick comedy, physical comedy]}
    add: {tags: [slapstick]}
  # Cult film is voted on widely (Top Gun at 1 of 2), so it needs real support.
  - match: {imdb_keywords: [cult film, cult classic], min_relevant: 2, min_percentage: 0.6}
    add: {tags: [cult classic]}
  - match: {imdb_keywords: [remake, horror movie remake, american remake, remake of cult film, remake of british series,
                            remake of 1930s film, remake of 1940s film, remake of 1950s film, remake of 1960s film,
                            remake of 1970s film, remake of 1980s film, remake of 1990s film, remake of french film,
                            remake of japanese film, remake of korean film]}
    add: {tags: [remake]}
  # Bare "possession" is also used loosely (The Thing, Being John Malkovich), so it needs a vote.
  - match: {imdb_keywords: [demonic possession, exorcism, exorcist, diabolical possession, bodily possession,
                            possessed girl, possessed boy, possessed woman, possessed man]}
    add: {tags: [possession]}
  - match: {imdb_keywords: [possession], min_relevant: 1}
    add: {tags: [possession]}
  - match: {imdb_keywords: [military, u.s. army, u.s. marine corps, u.s. military, u.s. navy, military base,
                            military training, u.s. soldier], min_relevant: 1}
    add: {tags: [military]}
  - match: {imdb_keywords: [based on play, based on a stage play, based on stage play, based on broadway play,
                            based on play by same name]}
    add: {tags: [based on a play]}
  - match: {imdb_keywords: [dark comedy, black comedy], min_relevant: 1}
    add: {tags: [dark comedy]}
  - match: {imdb_keywords: [sitcom, sitcom comedy, situation comedy, sitcom laughter]}
    item_types: [Series]
    add: {tags: [sitcom]}
  - match: {imdb_keywords: [tv mini series, tv miniseries, miniseries, mini series, limited series]}
    item_types: [Series]
    add: {tags: [miniseries]}
  # Not "some scenes in black and white" or "black and white to color": those films are in colour.
  - match: {imdb_keywords: [black and white, black and white movie, black and white film]}
    add: {tags: [black and white]}

  # --- Form & tone ---
  - match: {imdb_keywords: [parody, spoof]}
    add: {tags: [parody]}
  - match: {imdb_keywords: [mockumentary]}
    add: {tags: [mockumentary]}
  - match: {imdb_keywords: [stop motion, stop motion animation, claymation]}
    add: {tags: [stop motion]}
