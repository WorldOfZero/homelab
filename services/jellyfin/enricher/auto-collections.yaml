# Collection definitions for the Auto Collections Jellyfin plugin (KeksBombe). jellyfin-enricher
# pushes these into the plugin's configuration on every run. They are AUTHORITATIVE: edits
# made in the plugin's web UI to ExpressionCollections / TitleMatchPairs are overwritten, and a
# collection deleted here is deleted from the plugin. Other plugin settings are left alone.
#
# TAG expressions match Jellyfin tags. Tags come from TMDb plus jellyfin-enricher's IMDb keyword
# rules in config.yaml, so a new tag-based collection usually needs a rule there too.

plugin:
  name: Auto Collections        # as listed in Dashboard -> Plugins
  task_name: Auto Collection    # substring of the plugin's scheduled task; started after changes

# Merged into every ExpressionCollections entry unless the entry sets the field itself.
# SortBy/SortOrder are the plugin's enum values as exported from its UI (2 was the UI's choice
# for most collections; the decade and Bond collections used 0).
expression_defaults:
  CaseSensitive: false
  SortBy: 2
  SortOrder: 0

TitleMatchPairs: []

ExpressionCollections:
  # --- Studios ---
  - {CollectionName: Marvel Movies, Expression: 'STUDIO "Marvel"'}
  - {CollectionName: Streamed Collection, Expression: 'STUDIO "youtube" or STUDIO "twitch"'}

  # --- Themes (TAG) ---
