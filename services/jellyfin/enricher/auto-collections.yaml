  - {CollectionName: Vampires Collection, Expression: 'TAG "vampire"'}
  - {CollectionName: Zombie Collection, Expression: 'TAG "zombie"'}
  - {CollectionName: Werewolf Collection, Expression: 'TAG "werewolf"'}
