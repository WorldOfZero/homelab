# Poster settings for make_posters.py. Every key is optional.
#
# defaults apply to each poster. Without a background or accent, a poster gets colours from a hue
# derived from its collection name, so collections differ without being listed here.
defaults:
  foreground: "#f4f1ea"
  label: COLLECTION
  icon: rings          # a file in icons/, without .svg

# Per collection, by CollectionName in ../auto-collections.json:
#   title:      text, or a list of lines to break the title yourself (default: the name without
#               a trailing "Collection", wrapped to fit)
#   label:      the small text above the title
#   title_inset: pixels to narrow the title box by on each side, to keep it clear of art
#   icon:       a file in icons/, or none
#   logo:       a file in logos/ (without .svg/.png), shown in place of the icon; recoloured in
#               the accent colour unless logo_tint: false (for logos that have their own colours);
#               logo_box: [x, y, width, height] moves or enlarges it (default [130, 230, 740, 440])
#   backdrop_logo: a logo drawn large and faded behind the poster, under the dark fade; with
#               backdrop_box [x, y, width, height], backdrop_opacity (0.35) and backdrop_tint (true)
#   art:        a file in art/: line art over the whole poster, in the accent colour
#   flag:       a file in flags/, drawn full-bleed behind the poster with a dark fade towards the
#               title; the accent colours the label and rule
#   background, accent, foreground: colours
