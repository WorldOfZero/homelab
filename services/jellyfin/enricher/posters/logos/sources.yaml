# Studio, franchise and format logos for the collection posters. They are their owners'
# trademarks, and the ones marked `wiki: en` are non-free files from English Wikipedia, so the
# image files are never kept in git: fetch_logos.py downloads them from upload.wikimedia.org into
# this folder while the enricher's image builds, and make_posters.py runs it for any missing logo.
#
#   <name>: the logo's name in posters.yaml (logo: <name>)
#     file: the file's name on Wikimedia
#     wiki: commons (default) or en, where the file is hosted
#     fix:  strip_units - drop pt/mm units from the SVG's width and height, which resvg can't size
#           white_to_alpha - make the white background transparent (saved as PNG), so the logo
#           keeps its shape when it is recoloured
