x-logging-config:
  &logging-config
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"
    
configs:
  jellyfin-exporter:
    content: &jellyfin-exporter |
      import json
      import os
      import urllib.request
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      URL = os.environ["JELLYFIN_URL"]
      AUTH = 'MediaBrowser Token="' + os.environ["JELLYFIN_APIKEY"] + '"'
      ITEM_TYPES = {"MovieCount": "movie", "SeriesCount": "series", "EpisodeCount": "episode", "SongCount": "song", "AlbumCount": "album", "BookCount": "book"}


      def get(path):
          request = urllib.request.Request(URL + path, headers={"Authorization": AUTH, "Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=10) as response:
              return json.load(response)


      def label(value):
          return str(value or "").replace("\\", "\\\\").replace('"', '\\"').replace("\n", " ")


      def title(item):
          if item.get("SeriesName"):
              return "%s S%02dE%02d %s" % (item["SeriesName"], item.get("ParentIndexNumber") or 0, item.get("IndexNumber") or 0, item.get("Name"))
          return item.get("Name")


      def stream_lines(session):
          item, state = session["NowPlayingItem"], session.get("PlayState", {})
          info = session.get("TranscodingInfo") or {}
          key = 'session="%s"' % session["Id"][:8]
          identity = 'user="%s",client="%s",device="%s",title="%s",method="%s",paused="%s",video="%s",hardware="%s",reasons="%s"' % (
              label(session.get("UserName")), label(session.get("Client")), label(session.get("DeviceName")), label(title(item)),
              label(state.get("PlayMethod")), str(bool(state.get("IsPaused"))).lower(),
              "copy" if info.get("IsVideoDirect") else "transcode" if info else "",
              label(info.get("HardwareAccelerationType")), label(",".join(info.get("TranscodeReasons") or [])),
          )
          lines = ["jellyfin_stream_info{%s,%s} 1" % (key, identity)]
          if state.get("PositionTicks") is not None:
              lines.append("jellyfin_stream_position_seconds{%s} %.1f" % (key, state["PositionTicks"] / 10000000))
          if info.get("Bitrate"):
              lines.append("jellyfin_stream_bitrate_bps{%s} %d" % (key, info["Bitrate"]))
          if info.get("Framerate"):
              lines.append("jellyfin_stream_transcode_fps{%s} %s" % (key, info["Framerate"]))
          source = [m.get("RealFrameRate") for m in item.get("MediaStreams", []) if m.get("Type") == "Video"]
          if source and source[0]:
              lines.append("jellyfin_stream_source_fps{%s} %s" % (key, source[0]))
          # How far the transcode is ahead of the player. A low value means the player is about to stall.
          if info.get("CompletionPercentage") is not None and item.get("RunTimeTicks"):
              done = info["CompletionPercentage"] / 100 * item["RunTimeTicks"]
              lines.append("jellyfin_stream_buffer_seconds{%s} %.1f" % (key, (done - (state.get("PositionTicks") or 0)) / 10000000))
          return lines


      CACHE = {}


      def details(item):
          # People, studios and genres are not in the session data. Cache them, because they rarely change.
          key = item["Id"]
          if key not in CACHE:
              found = get("/Items?ids=%s&Fields=People,Studios,Genres" % key).get("Items") or [{}]
              CACHE[key] = found[0]
          return CACHE[key]


      def first(values):
          return values[0] if values else ""


      def interest_line(session):
          item = session["NowPlayingItem"]
          info = details(item)
          directors = [p.get("Name") for p in info.get("People") or [] if p.get("Type") == "Director"]
          studios = [s.get("Name") for s in info.get("Studios") or []]
          return 'jellyfin_stream_playing{user="%s",type="%s",title="%s",series="%s",artist="%s",album="%s",director="%s",studio="%s",genre="%s"} 1' % (
              label(session.get("UserName")), label(item.get("Type")), label(item.get("Name")), label(item.get("SeriesName")),
              label(item.get("AlbumArtist") or first(item.get("Artists"))), label(item.get("Album")),
              label(first(directors)), label(first(studios)), label(first(info.get("Genres"))),
          )


      def metrics():
          sessions = get("/Sessions")
          streams = [s for s in sessions if s.get("NowPlayingItem")]
          methods = {"DirectPlay": 0, "DirectStream": 0, "Transcode": 0}
          for stream in streams:
              method = stream.get("PlayState", {}).get("PlayMethod", "DirectPlay")
              methods[method] = methods.get(method, 0) + 1
          paused = sum(1 for s in streams if s.get("PlayState", {}).get("IsPaused"))
          lines = ["jellyfin_sessions_active %d" % sum(1 for s in sessions if s.get("IsActive"))]
          lines += ['jellyfin_streams{method="%s"} %d' % item for item in methods.items()]
          lines.append("jellyfin_streams_paused %d" % paused)
          # Every signed-in session, also one that plays nothing. SyncPlay logs name only the
          # session, so the Media Stack dashboard looks up the user here by the session label.
          for session in sessions:
              if session.get("UserName"):
                  lines.append('jellyfin_session_info{session="%s",user="%s",client="%s",device="%s"} 1' % (
                      session["Id"][:8], label(session.get("UserName")), label(session.get("Client")), label(session.get("DeviceName"))))
          for stream in streams:
              lines += stream_lines(stream)
              if not stream.get("PlayState", {}).get("IsPaused"):
                  lines.append(interest_line(stream))
          counts = get("/Items/Counts")
          lines += ['jellyfin_items{type="%s"} %d' % (name, counts.get(key, 0)) for key, name in ITEM_TYPES.items()]
          return "\n".join(lines) + "\n"


      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              try:
                  status, body = 200, metrics()
              except Exception as error:
                  status, body = 500, str(error) + "\n"
              self.send_response(status)
              self.send_header("Content-Type", "text/plain; version=0.0.4")
              self.end_headers()
              self.wfile.write(body.encode())

          def log_message(self, *args):
              pass


      ThreadingHTTPServer(("0.0.0.0", 9711), Handler).serve_forever()
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:8096"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

services:
  tailscale:
    image: tailscale/tailscale:v1.98 # Image to be used
    container_name: tailscale-jellyfin # Name for local container management
    hostname: jellyfin
    networks:
      - default
      - tailnet-local # Shared with the other sidecars on this host so tailscaled finds a direct path instead of relaying via DERP
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json # Tailscale Serve configuration to expose the web interface on your local Tailnet - remove this line if not required
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true              # Enable healthcheck endpoint: "/healthz"
      - TS_ENABLE_METRICS=true
      - TS_LOCAL_ADDR_PORT=0.0.0.0:41236       # The <addr>:<port> for the healthz and metrics endpoints
      - TS_ACCEPT_DNS=true # Uncomment when using MagicDNS
      - TS_AUTH_ONCE=true
      - TS_TAILSCALED_EXTRA_ARGS=--port=41642 # Fixed WireGuard port (host node uses the default 41641) so it can be published and port-forwarded
    ports:
      - 41642:41642/udp # Forward UDP 41642 on the router to minerva so remote clients connect directly instead of via DERP
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - '/mnt/Fast/Configuration/tailscale/state-jellyfin:/var/lib/tailscale'
    devices:
      - /dev/net/tun:/dev/net/tun # Network configuration for Tailscale to work
    cap_add:
      - net_admin # Tailscale requirement
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41236/healthz"] # Check Tailscale has a Tailnet IP and is operational
      interval: 1m # How often to perform the check
      timeout: 10s # Time to wait for the check to succeed
      retries: 3 # Number of retries before marking as unhealthy
      start_period: 10s # Time to wait before starting health checks
    logging: *logging-config

  application:
    image: jellyfin/jellyfin:12.2
    network_mode: service:tailscale
    container_name: app-jellyfin
    user: 1000:1000
    environment:
      - TZ=America/Los_Angeles
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    volumes:
      - '/mnt/Fast/Configuration/jellyfin/config:/config'
      - '/mnt/Fast/Configuration/jellyfin/cache:/cache'
      # Read-only: artwork, NFO, subtitle and trickplay savers must keep their files under /config (see README)
      - type: bind
        source: /mnt/Vault/Media
        target: /media
        read_only: true
      # Fonts for subtitles
      - type: bind
        source: /mnt/Vault/Media/Fonts
        target: /usr/local/share/fonts/custom
        read_only: true

    # Transcode segments go to RAM, not the Fast NVMe. /cache/transcodes is Jellyfin's default
    # transcode path. uid/gid are necessary because Docker creates tmpfs mounts owned by root.
    tmpfs:
      - /cache/transcodes:size=4G,uid=1000,gid=1000,mode=0755
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8096/health"] # Jellyfin's built-in health endpoint; catches a hung server, not just a dead one
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 15m # Long enough for a database migration after an image upgrade; do not restart the container during one
    depends_on:
      tailscale:
        condition: service_healthy
    restart: 'unless-stopped'
    # TODO: setup published server address
    #environment:
    #  - JELLYFIN_PublishedServerUrl=http://jellyfin.home.worldofzero.com
    logging: *logging-config

  # Additively tags items from IMDb keywords (rules in enricher/config.yaml) so the Auto
  # Collections plugin's TAG rules catch films TMDb never tagged. See enricher/README.md.
  enricher:
    build: ./enricher
    network_mode: service:tailscale # Reaches Jellyfin on 127.0.0.1:8096
    container_name: jellyfin-enricher
    environment:
      - TZ=America/Los_Angeles
      - JELLYFIN_URL=http://127.0.0.1:8096
      - JELLYFIN_APIKEY=${JELLYFIN_APIKEY}
      - RUN_AT=03:00 # After Kometa's old 02:00 slot, before morning viewing
      - DRY_RUN=${ENRICHER_DRY_RUN:-true} # Logs intended changes only; set ENRICHER_DRY_RUN=false to write
    volumes:
      - '/mnt/Fast/Configuration/jellyfin/enricher:/data' # IMDb keyword cache; must be owned by 1000:1000
      # Jellyfin's collection folders (/config/data/collections in Jellyfin): collection posters are
      # written here as poster.jpg and picked up on refresh. Uploading them through the API made
      # Jellyfin delete the movie posters the Auto Collections plugin had borrowed. See enricher/README.md.
      - '/mnt/Fast/Configuration/jellyfin/config/data/collections:/collections'
    depends_on:
      - application
    restart: 'unless-stopped'
    logging: *logging-config

  # Jellyfin /metrics has no sessions or library counts, so this exporter reads them from the API.
  exporter:
    image: python:3.13-alpine3.24
    labels:
      # Changes the service when the config changes, so that a Git update recreates the container.
      config-content: *jellyfin-exporter
    container_name: jellyfin-exporter
    network_mode: service:tailscale # Prometheus connects through tailnet-local
    configs:
      - source: jellyfin-exporter
        target: /exporter.py
    command: ["python", "-u", "/exporter.py"]
    environment:
      - JELLYFIN_URL=http://127.0.0.1:8096
      - JELLYFIN_APIKEY=${JELLYFIN_APIKEY}
    depends_on:
      - application
    restart: unless-stopped
    logging: *logging-config

networks:
  tailnet-local:
    external: true # Create once on the host: docker network create tailnet-local
