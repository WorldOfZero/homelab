
x-logging-config:
  &logging-config
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

services:
  fenrus:
    image: revenz/fenrus:23.08
    labels:
      logging: "promtail"
      stack: fenrus
    restart: unless-stopped
    ports:
      - 3000:3000
    environment:
      - TZ=America/Los_Angeles
    volumes:
      - /mnt/Fast/Configuration/fenrus:/app/data
    logging: *logging-config