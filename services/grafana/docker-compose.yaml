# This is for the full monitoring stack to simplify things

x-logging-config:
  &logging-config
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"
    tag: "{{.Name}}"

configs:
  ts-serve:
    content: |
      {"TCP":{"443":{"HTTPS":true}},
      "Web":{"$${TS_CERT_DOMAIN}:443":
          {"Handlers":{"/":
          {"Proxy":"http://127.0.0.1:3000"}}}},
      "AllowFunnel":{"$${TS_CERT_DOMAIN}:443":false}}

  alloy-config:
    content: &alloy-config |
      discovery.docker "containers" {
        host = "unix:///var/run/docker.sock"
      }

      discovery.relabel "containers" {
        targets = []

        rule {
          source_labels = ["__meta_docker_container_name"]
          regex         = "/(.*)"
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_docker_container_log_stream"]
          target_label  = "logstream"
        }

        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_project"]
          target_label  = "stack"
        }

        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "service"
        }
      }

      loki.source.docker "containers" {
        host          = "unix:///var/run/docker.sock"
        targets       = discovery.docker.containers.targets
        relabel_rules = discovery.relabel.containers.rules
        forward_to    = [loki.write.default.receiver]
      }

      // Roon writes its stream errors to this file, not to the container log.
      local.file_match "roon" {
        path_targets = [{
          __path__  = "/roon-logs/RoonServer_log.txt",
          stack     = "roon",
          service   = "roonserver",
          container = "roonserver",
          logstream = "file",
        }]
      }

      loki.source.file "roon" {
        targets    = local.file_match.roon.targets
        forward_to = [loki.process.roon.receiver]
      }

      // Use the time in the Roon log line, not the time that Alloy read the line.
      loki.process "roon" {
        forward_to = [loki.write.default.receiver]

        stage.regex {
          expression = "^(?P<time>[0-9]{2}/[0-9]{2} [0-9]{2}:[0-9]{2}:[0-9]{2}) "
        }

        stage.timestamp {
          source   = "time"
          format   = "01/02 15:04:05"
          location = "America/Los_Angeles"
        }
      }

      // UniFi SIEM logs. The raw format also keeps lines that a strict syslog parser rejects.
      loki.source.syslog "unifi" {
        listener {
          address       = "0.0.0.0:1514"
          protocol      = "udp"
          syslog_format = "raw"
          labels        = { stack = "unifi", service = "unifi-siem", container = "unifi", logstream = "syslog" }
        }

        listener {
          address       = "0.0.0.0:1514"
          protocol      = "tcp"
          syslog_format = "raw"
          labels        = { stack = "unifi", service = "unifi-siem", container = "unifi", logstream = "syslog" }
        }

        forward_to = [loki.process.unifi.receiver]
      }

      loki.process "unifi" {
        forward_to = [loki.write.default.receiver]

        // The product separates firewall events from system events without many streams.
        stage.regex {
          expression = "CEF:[0-9]+\\|[^|]*\\|(?P<product>[^|]*)\\|"
        }

        stage.labels {
          values = { product = "" }
        }
      }

      loki.write "default" {
        endpoint {
          url = "http://loki:3100/loki/api/v1/push"
        }
      }

  docker-state-exporter:
    content: &docker-state-exporter |
      import datetime
      import http.client
      import json
      import socket
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      HEALTH = {"healthy": 1, "starting": 2, "unhealthy": 3}


      class DockerConnection(http.client.HTTPConnection):
          def connect(self):
              self.sock = socket.socket(socket.AF_UNIX)
              self.sock.settimeout(self.timeout)
              self.sock.connect("/var/run/docker.sock")


      def get(path):
          connection = DockerConnection("docker", timeout=10)
          try:
              connection.request("GET", path)
              response = connection.getresponse()
              if response.status != 200:
                  response.read()
                  return None
              return json.load(response)
          finally:
              connection.close()


      def started_at(text):
          value = datetime.datetime.fromisoformat(text[:19] + "+00:00").timestamp()
          return max(value, 0)


      def metrics():
          lines = []
          for summary in get("/containers/json?all=1"):
              # A container can disappear between the list and this call.
              container = get("/containers/" + summary["Id"] + "/json")
              if container is None:
                  continue
              state = container["State"]
              labels = container["Config"]["Labels"] or {}
              identity = 'name="%s",stack="%s",service="%s"' % (
                  container["Name"].lstrip("/"),
                  labels.get("com.docker.compose.project", ""),
                  labels.get("com.docker.compose.service", ""),
              )
              # Docker keeps the last health status after a container stops.
              health = HEALTH.get((state.get("Health") or {}).get("Status"), 0) if state["Running"] else 0
              values = {
                  "running": int(state["Running"]),
                  "health": health,
                  "restart_count": container["RestartCount"],
                  "oom_killed": int(state["OOMKilled"]),
                  "exit_code": state["ExitCode"],
                  "started_at_seconds": started_at(state["StartedAt"]),
              }
              lines += ["docker_container_%s{%s} %s" % (key, identity, value) for key, value in values.items()]
          return "\n".join(lines) + "\n"


      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              try:
                  status, body = 200, metrics()
              except Exception as error:
                  status, body = 500, str(error) + "\n"
              self.send_response(status)
              self.send_header("Content-Type", "text/plain; version=0.0.4")
              self.end_headers()
              self.wfile.write(body.encode())

          def log_message(self, *args):
              pass


      ThreadingHTTPServer(("0.0.0.0", 9417), Handler).serve_forever()

  blackbox-config:
    content: &blackbox-config |
      modules:
        http_2xx:
          prober: http
          timeout: 15s
          http:
            preferred_ip_protocol: ip4

  lastfm-exporter:
    content: &lastfm-exporter |
      import json
      import os
      import threading
      import time
      import urllib.parse
      import urllib.request
      from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

      KEY = os.environ.get("LASTFM_API_KEY", "")
      USER = os.environ.get("LASTFM_USER", "")
      BODY = ["lastfm_configured %d" % (1 if KEY and USER else 0)]
      SEEN = set()


      def label(value):
          return str(value or "").replace("\\", "\\\\").replace('"', '\\"').replace("\n", " ")


      def call(method, **params):
          query = dict(method=method, user=USER, api_key=KEY, format="json", **params)
          with urllib.request.urlopen("https://ws.audioscrobbler.com/2.0/?" + urllib.parse.urlencode(query), timeout=30) as response:
              return json.load(response)


      def text(value):
          return value.get("#text", value.get("name", "")) if isinstance(value, dict) else value


      def refresh():
          lines = ["lastfm_configured 1"]
          for row in call("user.gettopartists", period="1month", limit=25)["topartists"]["artist"]:
              lines.append('lastfm_top_artist_plays{artist="%s"} %s' % (label(row["name"]), row["playcount"]))
          for row in call("user.gettopalbums", period="1month", limit=25)["topalbums"]["album"]:
              lines.append('lastfm_top_album_plays{album="%s",artist="%s"} %s' % (label(row["name"]), label(text(row["artist"])), row["playcount"]))
          for row in call("user.gettoptracks", period="1month", limit=25)["toptracks"]["track"]:
              lines.append('lastfm_top_track_plays{track="%s",artist="%s"} %s' % (label(row["name"]), label(text(row["artist"])), row["playcount"]))
          for row in reversed(call("user.getrecenttracks", limit=100)["recenttracks"]["track"]):
              # A track that plays now has no date yet. It is logged after it ends.
              when = (row.get("date") or {}).get("uts")
              if when and (when, row["name"]) not in SEEN:
                  SEEN.add((when, row["name"]))
                  print(json.dumps({"event": "scrobble", "time": int(when), "artist": text(row["artist"]), "album": text(row["album"]), "track": row["name"]}), flush=True)
          lines.append("lastfm_last_refresh_seconds %d" % time.time())
          return lines


      def loop():
          global BODY
          while KEY and USER:
              try:
                  BODY = refresh()
              except Exception as error:
                  print(json.dumps({"event": "error", "error": str(error).replace(KEY, "<key>")}), flush=True)
              time.sleep(600)


      class Handler(BaseHTTPRequestHandler):
          def do_GET(self):
              self.send_response(200)
              self.send_header("Content-Type", "text/plain; version=0.0.4")
              self.end_headers()
              self.wfile.write(("\n".join(BODY) + "\n").encode())

          def log_message(self, *args):
              pass


      threading.Thread(target=loop, daemon=True).start()
      ThreadingHTTPServer(("0.0.0.0", 9718), Handler).serve_forever()

  prometheus-config:
    content: &prometheus-config |
      global:
        scrape_interval: 30s
        evaluation_interval: 30s

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: cadvisor
          static_configs:
            - targets: ["cadvisor:8080"]

        # node-exporter uses host networking, so it has no address on the stack network.
        - job_name: node
          static_configs:
            - targets: ["host.docker.internal:9100"]
              labels:
                instance: minerva

        - job_name: docker-state
          static_configs:
            - targets: ["docker-state-exporter:9417"]

        - job_name: grafana
          static_configs:
            # Grafana uses the network of its sidecar, so it has no name of its own.
            - targets: ["tailscale:3000"]

        - job_name: loki
          static_configs:
            - targets: ["loki:3100"]

        - job_name: alloy
          static_configs:
            - targets: ["alloy:12345"]

        # Probes use the tailnet address of each application, so they test the path that users take.
        - job_name: blackbox
          scrape_interval: 1m
          metrics_path: /probe
          params:
            module: [http_2xx]
          static_configs:
            - targets: ["https://flights.comet-stork.ts.net/api/ping"]
              labels:
                app: flights
            - targets: ["https://tandoor.comet-stork.ts.net/"]
              labels:
                app: tandoor
            - targets: ["https://karakeep.comet-stork.ts.net/"]
              labels:
                app: karakeep
            - targets: ["https://kavita.comet-stork.ts.net/"]
              labels:
                app: kavita
            - targets: ["https://gamescores.comet-stork.ts.net/healthz"]
              labels:
                app: gamescores
            - targets: ["https://idp.comet-stork.ts.net/.well-known/openid-configuration"]
              labels:
                app: tsidp
            - targets: ["https://jellyfin.comet-stork.ts.net/health"]
              labels:
                app: jellyfin
            - targets: ["https://ollama.comet-stork.ts.net/api/version"]
              labels:
                app: ollama
          relabel_configs:
            - source_labels: [__address__]
              target_label: __param_target
            - source_labels: [__param_target]
              target_label: instance
            - target_label: __address__
              replacement: tailscale:9115

        # Each scrape counts rows in the Karakeep database.
        - job_name: karakeep
          scrape_interval: 1m
          metrics_path: /api/metrics
          authorization:
            credentials: ${KARAKEEP_PROMETHEUS_TOKEN:?Set KARAKEEP_PROMETHEUS_TOKEN in the Portainer stack variables}
          static_configs:
            - targets: ["tailscale-karakeep:3000"]

        - job_name: lastfm
          scrape_interval: 2m
          static_configs:
            - targets: ["lastfm-exporter:9718"]

        - job_name: nvidia
          static_configs:
            - targets: ["nvidia-exporter:9835"]

        # The bytes on each tailnet path: direct, DERP or peer relay.
        - job_name: tailscale
          static_configs:
            - targets:
                - "tailscale-airtrail:41234"
                - "tailscale-bazarr:41234"
                - "tailscale-gamescores:41234"
                - "tailscale-grafana:41234"
                - "tailscale-homepage:41234"
                - "tailscale-jellyfin:41236"
                - "tailscale-karakeep:41234"
                - "tailscale-kavita:41234"
                - "tailscale-kuma:41234"
                - "tailscale-ollama:41234"
                - "tailscale-radarr:41234"
                - "tailscale-seerr:41234"
                - "tailscale-sonarr:41234"
                - "tailscale-tandoor:41234"
                - "tailscale-themearr:41234"
                - "tailscale-tsidp:41234"
                - "tailscale-wallos:41234"
            - targets: ["192.168.1.43:41235"]
              labels:
                node: minerva
          relabel_configs:
            - source_labels: [__address__]
              regex: tailscale-(.+):\d+
              target_label: node
          metric_relabel_configs:
            - source_labels: [__name__]
              regex: tailscaled_(inbound|outbound)_(bytes|packets|dropped_packets)_total
              action: keep

        - job_name: jellyfin
          static_configs:
            - targets: ["tailscale-jellyfin:8096"]

        - job_name: jellyfin-exporter
          static_configs:
            - targets: ["tailscale-jellyfin:9711"]

        # Each exportarr scrape reads the full library through the API of the application.
        - job_name: sonarr
          scrape_interval: 2m
          scrape_timeout: 1m
          static_configs:
            - targets: ["tailscale-sonarr:9707"]

        - job_name: radarr
          scrape_interval: 2m
          scrape_timeout: 1m
          static_configs:
            - targets: ["tailscale-radarr:9707"]

        - job_name: bazarr
          scrape_interval: 2m
          scrape_timeout: 1m
          static_configs:
            - targets: ["tailscale-bazarr:9707"]

  loki-config:
    content: &loki-config |
      auth_enabled: false

      server:
        http_listen_port: 3100
        grpc_listen_port: 9096

      common:
        instance_addr: 127.0.0.1
        path_prefix: /loki
        storage:
          filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory

      frontend:
        max_outstanding_per_tenant: 2048

      pattern_ingester:
        enabled: true

      limits_config:
        max_global_streams_per_user: 0
        ingestion_rate_mb: 50000
        ingestion_burst_size_mb: 50000
        volume_enabled: true
        retention_period: 720h

      compactor:
        working_directory: /loki/compactor
        retention_enabled: true
        delete_request_store: filesystem

      query_range:
        results_cache:
          cache:
            embedded_cache:
              enabled: true
              max_size_mb: 100

      schema_config:
        configs:
          - from: 2020-10-24
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h

      ruler:
        alertmanager_url: http://localhost:9093

      analytics:
        reporting_enabled: false

services:
  tailscale:
    image: tailscale/tailscale:v1.98
    container_name: tailscale-grafana
    hostname: grafana # Name used within your Tailscale environment
    networks:
      - default
      - tailnet-local # Shared with the other sidecars on this host so tailscaled finds a direct path instead of relaying via DERP
    ports:
      - 3001:3000 # Grafana on the LAN
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
      - TS_USERSPACE=false
      - TS_ENABLE_HEALTH_CHECK=true
      - TS_ENABLE_METRICS=true
      - TS_LOCAL_ADDR_PORT=0.0.0.0:41234
      - TS_ACCEPT_DNS=true # Grafana reaches tsidp by its tailnet name. Docker names still resolve.
      - TS_AUTH_ONCE=true
    configs:
      - source: ts-serve
        target: /config/serve.json
    volumes:
      - '/mnt/Fast/Configuration/tailscale/state-grafana:/var/lib/tailscale'
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - net_admin
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:41234/healthz"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    logging: *logging-config

  grafana:
    build: .
    restart: unless-stopped
    user: "472:472"
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    environment:
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - GF_SERVER_ROOT_URL=https://grafana.comet-stork.ts.net
      # Log in with Tailscale through tsidp. The login form stays as a way in when tsidp is down.
      - GF_AUTH_GENERIC_OAUTH_ENABLED=true
      - GF_AUTH_GENERIC_OAUTH_NAME=Tailscale
      - GF_AUTH_GENERIC_OAUTH_CLIENT_ID=${GRAFANA_OIDC_CLIENT_ID:?Set GRAFANA_OIDC_CLIENT_ID in the Portainer stack variables}
      - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET=${GRAFANA_OIDC_CLIENT_SECRET:?Set GRAFANA_OIDC_CLIENT_SECRET in the Portainer stack variables}
      - GF_AUTH_GENERIC_OAUTH_SCOPES=openid email profile
      - GF_AUTH_GENERIC_OAUTH_AUTH_URL=https://idp.comet-stork.ts.net/authorize
      - GF_AUTH_GENERIC_OAUTH_TOKEN_URL=https://idp.comet-stork.ts.net/token
      - GF_AUTH_GENERIC_OAUTH_API_URL=https://idp.comet-stork.ts.net/userinfo
      - GF_AUTH_GENERIC_OAUTH_USE_PKCE=true
      - GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP=true
      - "GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH=email == '${GRAFANA_ADMIN_EMAIL:?Set GRAFANA_ADMIN_EMAIL in the Portainer stack variables}' && 'Admin' || 'Viewer'"
    volumes:
      - '/mnt/Fast/Configuration/grafana/data:/var/lib/grafana:rw'
    logging: *logging-config

  loki:
    image: grafana/loki:3.7.1
    labels:
      # Changes the service when the config changes, so that a Git update recreates the container.
      config-content: *loki-config
    restart: unless-stopped
    configs:
      - source: loki-config
        target: /etc/loki/local-config.yaml
    volumes:
      - '/mnt/Fast/Telemetry/loki:/loki' # Must be owned by 10001:10001
    command: -config.file=/etc/loki/local-config.yaml
    logging: *logging-config

  alloy:
    image: grafana/alloy:v1.21.3
    labels:
      # Changes the service when the config changes, so that a Git update recreates the container.
      config-content: *alloy-config
    restart: unless-stopped
    ports:
      - 1514:1514/udp # UniFi SIEM logs
      - 1514:1514/tcp
    depends_on:
      - loki
    configs:
      - source: alloy-config
        target: /etc/alloy/config.alloy
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - '/mnt/Fast/Telemetry/alloy:/var/lib/alloy/data' # Read positions, so a restart does not send logs again
      - '/mnt/Fast/Configuration/roon/data/RoonServer/Logs:/roon-logs:ro'
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --stability.level=experimental # Needed for the raw syslog format
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    logging: *logging-config

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.55.1
    restart: unless-stopped
    volumes:
      - '/:/rootfs:ro'
      - '/sys:/sys:ro'
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
      - '/var/lib/docker:/var/lib/docker:ro'
      # cAdvisor reports no containers without this socket. Fail the deploy if the path is wrong.
      - type: bind
        source: /run/containerd/containerd.sock
        target: /run/containerd/containerd.sock
        read_only: true
        bind:
          create_host_path: false
    command:
      - '-docker_only'
      - '-housekeeping_interval=30s'
      - '-store_container_labels=false'
      - '-whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service'
    logging: *logging-config

  # Reads top music for the last month. Roon sends its plays to last.fm.
  lastfm-exporter:
    image: python:3.13-alpine3.24
    labels:
      # Changes the service when the config changes, so that a Git update recreates the container.
      config-content: *lastfm-exporter
    restart: unless-stopped
    configs:
      - source: lastfm-exporter
        target: /exporter.py
    environment:
      - LASTFM_API_KEY=${LASTFM_API_KEY:-}
      - LASTFM_USER=${LASTFM_USER:-}
    command: ["python", "-u", "/exporter.py"]
    logging: *logging-config

  # Reports the memory and use of the T400, which Jellyfin and Ollama share.
  # Do not use the -nvml image. It needs x86-64-v3 (AVX2), and the CPU of minerva does not have it.
  nvidia-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.17.0
    restart: unless-stopped
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    logging: *logging-config

  # Uses the sidecar network, so its probes follow the same path as a tailnet client.
  blackbox:
    image: prom/blackbox-exporter:v0.29.1
    labels:
      # Changes the service when the config changes, so that a Git update recreates the container.
      config-content: *blackbox-config
    restart: unless-stopped
    network_mode: service:tailscale
    depends_on:
      tailscale:
        condition: service_healthy
    configs:
      - source: blackbox-config
        target: /etc/blackbox/config.yaml
    command:
      - --config.file=/etc/blackbox/config.yaml
    logging: *logging-config

  # cAdvisor does not report Docker health, restart counts or OOM kills. Only GET calls use the socket.
  docker-state-exporter:
    image: python:3.13-alpine3.24
    labels:
      # Changes the service when the config changes, so that a Git update recreates the container.
      config-content: *docker-state-exporter
    restart: unless-stopped
    configs:
      - source: docker-state-exporter
        target: /exporter.py
    volumes:
      - '/var/run/docker.sock:/var/run/docker.sock:ro'
    command: ["python", "-u", "/exporter.py"]
    logging: *logging-config

  # Host networking and the host PID namespace make the NIC and process metrics those of minerva.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    network_mode: host
    pid: host
    volumes:
      - '/:/host:ro,rslave'
    command:
      - --path.rootfs=/host
    logging: *logging-config

  prometheus:
    image: prom/prometheus:v3.11.2
    labels:
      # Changes the service when the config changes, so that a Git update recreates the container.
      config-content: *prometheus-config
    restart: unless-stopped
    ports:
      - 9090:9090
    networks:
      - default
      - tailnet-local # Reaches the application exporters through their Tailscale sidecars
    extra_hosts:
      - host.docker.internal:host-gateway
    configs:
      - source: prometheus-config
        target: /etc/prometheus/prometheus.yaml
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=20GB
    volumes:
      - '/mnt/Fast/Telemetry/prometheus:/prometheus' # Must be owned by 65534:65534
    depends_on:
      - cadvisor
    logging: *logging-config

networks:
  tailnet-local:
